name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Find & Publish App
      shell: pwsh
      run: |
        $proj = Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.Name -like "*App.csproj" -or $_.Name -like "*Hangly*.csproj" -or $_.Name -like "*Jingly*.csproj" } | Select-Object -First 1
        if (-not $proj) {
            $proj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
        }
        if (-not $proj) {
            Write-Error "No .csproj project file found in the repository!"
            exit 1
        }
        Write-Host "Found and building project: $($proj.FullName)"
        dotnet publish $proj.FullName -c Release -r win-x64 -p:Platform=x64 --self-contained false -o ./publish_output

    - name: Create ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish_output/* -DestinationPath ./Hangly.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./Hangly.zip
        tag_name: ${{ inputs.version || github.ref_name }}
        name: Hangly ${{ inputs.version || github.ref_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
