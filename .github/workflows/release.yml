name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build & Publish App
      run: |
        dotnet publish Hangly.App -c Release -r win-x64 --self-contained false -o ./publish_output

    - name: Create ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish_output/* -DestinationPath ./Hangly.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./Hangly.zip
        tag_name: ${{ github.ref_name || 'v1.0.1' }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
